name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: format, compile, test, audit, credo
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27.3.4"
          elixir-version: "1.20.4"
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix credo --strict
      - run: mix hex.audit

  # Dependency security gates (AST-181 H-03). `mix hex.audit` checks the lock
  # against Hex retirements and advisories; `mix_audit` reads its own
  # advisory database, and the two have disagreed (SDLC-96), so both run.
  # mix_audit is installed as an escript so the package's mix.exs and lock
  # stay untouched.
  audit:
    name: hex.audit + deps.audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4"
          elixir-version: "1.20.4"
      - run: mix deps.get
      - run: mix hex.audit
      - run: mix escript.install --force hex mix_audit
      - run: ~/.mix/escripts/mix_audit
